    <style>
        :root { 
            --theme-prim: #ccff00; 
            --theme-dan: #dc2626; 
            --bg-base: #070709;
        }
        body { 
            background-color: var(--bg-base); 
            color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden; 
        }
        
        /* Ambient Background */
        .ambient-map { 
            position: fixed; inset: 0; z-index: -2; 
            background-color: var(--theme-prim); 
            -webkit-mask-image: url('https://upload.wikimedia.org/wikipedia/commons/e/ec/World_map_blank_without_borders.svg'); 
            mask-image: url('https://upload.wikimedia.org/wikipedia/commons/e/ec/World_map_blank_without_borders.svg'); 
            -webkit-mask-size: cover; mask-size: cover; opacity: 0.04; 
        }
        .ambient-lights { 
            position: fixed; inset: 0; z-index: -1; 
            background: radial-gradient(circle at 20% 30%, rgba(220, 38, 38, 0.15) 0%, transparent 50%), 
                        radial-gradient(circle at 80% 70%, rgba(204, 255, 0, 0.1) 0%, transparent 50%); 
            pointer-events: none; 
        }
        
        /* Glassmorphism */
        .glass-box { 
            background: linear-gradient(145deg, rgba(25, 25, 30, 0.6) 0%, rgba(10, 10, 12, 0.8) 100%); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); 
        }
        
        /* Inputs & Buttons */
        .field-input, .field-select { 
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: all 0.3s; 
        }
        .field-input:focus, .field-select:focus { 
            background: rgba(204, 255, 0, 0.05); border-color: var(--theme-prim); outline: none; box-shadow: 0 0 10px rgba(204, 255, 0, 0.2);
        }
        .field-select option { background: #1a1a1a; color: #fff; }

        .btn-main { 
            background: linear-gradient(135deg, #ccff00 0%, #99cc00 100%); color: #000; transition: all 0.3s ease; 
        }
        .btn-main:hover:not(:disabled) { 
            transform: translateY(-2px); box-shadow: 0 8px 20px rgba(204, 255, 0, 0.3); 
        }
        .btn-main:disabled { 
            opacity: 0.5; cursor: not-allowed; filter: grayscale(80%); transform: none;
        }

        /* Process Animation UI */
        .process-container {
            overflow: hidden;
            transition: all 0.4s ease-in-out;
            max-height: 0;
            opacity: 0;
        }
        .process-container.active {
            max-height: 200px;
            opacity: 1;
            margin-top: 1.5rem;
        }
        .progress-bar-bg {
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            height: 6px;
            width: 100%;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--theme-prim);
            box-shadow: 0 0 10px var(--theme-prim);
            transition: width 0.4s ease;
        }
        .status-text {
            font-size: 0.75rem;
            color: #a3a3a3;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 8px;
            font-weight: 700;
        }
        .status-icon {
            display: inline-block;

        }
        @keyframes pulse-icon {
            0% { transform: scale(0.9); opacity: 0.7; color: var(--theme-prim); }
            100% { transform: scale(1.1); opacity: 1; color: #fff; }
        }

        /* Scrollbar */

        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

                    hex += str.charCodeAt(i).toString(16).padStart(2, '0');
                }
                return hex;
            };

                // Construct standard SIP structures
                const sip1 = `INVITE sip:${user}@${domain} SIP/2.0\\r\\nVia: SIP/2.0/UDP 192.168.1.1;branch=z9hG4bK776asdhds\\r\\nMax-Forwards: 70\\r\\nTo: <sip:${user}@${domain}>\\r\\nFrom: <sip:caller@${domain}>;tag=${tag}\\r\\nCall-ID: ${callId}\\r\\nCSeq: 1 INVITE\\r\\nContent-Length: 0\\r\\n\\r\\n`;
                const sip2 = `SIP/2.0 100 Trying\\r\\nVia: SIP/2.0/UDP 192.168.1.1;branch=z9hG4bK776asdhds\\r\\nTo: <sip:${user}@${domain}>\\r\\nFrom: <sip:caller@${domain}>;tag=${tag}\\r\\nCall-ID: ${callId}\\r\\nCSeq: 1 INVITE\\r\\nContent-Length: 0\\r\\n\\r\\n`;

                const rawSip1 = sip1.replace(/\\\\r\\\\n/g, '\\r\\n');
                const rawSip2 = sip2.replace(/\\\\r\\\\n/g, '\\r\\n');

                return {
                    i1: `<b 0x${stringToHex(rawSip1)}>`,
                    i2: `<b 0x${stringToHex(rawSip2)}>`
                };
            };

            // Reverted back to original static Magic Headers
            const generateMagicHeaders = () => {
                return `S1 = 0\\nS2 = 0\\nH1 = 1\\nH2 = 2\\nH3 = 3\\nH4 = 4`;
            };

            const updateProgress = async (percent, text) => {
                UI.progFill.style.width = `${percent}%`;
                UI.statusPercent.innerText = `${percent}%`;
                UI.statusText.innerText = text;
                await sleep(500); // UI visual delay
            };

            const buildGuideText = (name) => `🛡️ MR.RAPTOR PREMIUM VPN 🛡️
(Profile: ${name})
========================================

⚠️ [အရေးကြီး သတိပေးချက် - ၁ လုံးတည်းသာ သုံးရန်]
ဤ VPN Config သည် စက်တစ်လုံးတည်း (1 Device Only) အတွက်သာ သီးသန့်ထုတ်လုပ်ထားခြင်း ဖြစ်ပါသည်။ ဖုန်းတစ်လုံးထက်ပို၍ဖြစ်စေ၊ ကွန်ပျူတာနှင့် ပြိုင်တူဖြစ်စေ ခွဲသုံးပါက စနစ်မှ အလိုအလျောက် ပိတ်ပင် (Auto Block) မည်ဖြစ်ပြီး လိုင်းလုံးဝ ပြတ်တောက်သွားပါမည်။

📥 [၁] လိုအပ်သော App ဒေါင်းလုဒ်ရယူရန်

            const generateConfig = async () => {
                const inputVal = UI.inName.value.trim();
                if (!inputVal) {
                    alert("Please enter a Profile Name! (အမည်တစ်ခုခု ပေးပါ)");

                }

                UI.btnGen.disabled = true;
                UI.btnText.innerText = "Processing...";
                UI.errorMsg.classList.add('hidden');
                
                // Show Progress UI
                UI.processUI.classList.add('active');
                
                try {
                    // Step 1: Keys
                    await updateProgress(15, "Generating Cryptographic Keys...");
                    const keyPair = nacl.box.keyPair();
                    const privateKey = btoa(String.fromCharCode(...keyPair.secretKey));
                    const publicKey = btoa(String.fromCharCode(...keyPair.publicKey));
                    const genUUID = () => crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });

                    // Step 2: API
                    await updateProgress(40, "Registering with Cloudflare WARP...");
                    const cleanUrl = WORKER_URL.endsWith('/') ? WORKER_URL.slice(0, -1) : WORKER_URL;
                    const res = await fetch(`${cleanUrl}/api/generate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            key: publicKey, 
                            install_id: genUUID(), 
                            fcm_token: `${genUUID()}:APA91b${genUUID()}`,

                    const data = await res.json();
                    if (!res.ok || !data.success) throw new Error(data.error || "API Response Failed");

                    // Step 3: Obfuscation
                    await updateProgress(70, "Applying Dynamic SIP Spoofing...");
                    const lvl = UI.inLevel.value;
                    let awgParams = "";
                    let mtu = 1280;

                    if (lvl === 'low') {
                        awgParams = `Jc = 3\\nJmin = 1\\nJmax = 3`;
                    } else if (lvl === 'medium') {
                        awgParams = `Jc = 4\\nJmin = 10\\nJmax = 20`;
                    } else {
                        awgParams = `Jc = 5\\nJmin = 30\\nJmax = 60`;
                        mtu = 1390;
                    }
                    
                    const payloads = generateDynamicPayloads();
                    const magicHeaders = generateMagicHeaders();

                    // Step 4: Finalize
                    await updateProgress(90, "Finalizing Custom Profile...");
                    
                    const profileName = inputVal;
                    const fileSafeName = profileName.replace(/[^a-zA-Z0-9]/g, '_');
                    const selectedEndpoint = ENDPOINTS[Math.floor(Math.random() * ENDPOINTS.length)];
                    const enhancedDNS = "8.8.8.8, 8.8.4.4, 1.1.1.1, 2606:4700:4700::1111";

                    const finalConfig = `[Interface]
PrivateKey = ${privateKey}
Address = ${data.data.ipv4}/32, ${data.data.ipv6}/128
DNS = ${enhancedDNS}
MTU = ${mtu}
${awgParams}
${magicHeaders}

                    currentSession = { 
                        name: profileName, 
                        fileName: fileSafeName, 
                        endpoint: selectedEndpoint, 
                        configStr: finalConfig, 
                        guideStr: buildGuideText(profileName) 
                    };
                    
                    await updateProgress(100, "Configuration Ready!");
                    await sleep(600);

                    // Show Result
                    UI.processUI.classList.remove('active');
                    UI.builderSection.classList.add('hidden');
                    
                    document.getElementById('res-name').innerText = currentSession.name;
                    document.getElementById('res-endpoint').innerText = `GW: ${currentSession.endpoint}`;
                    UI.guideBox.value = currentSession.guideStr;
                    UI.resSection.classList.remove('hidden');

                } catch (error) {
                    UI.errorMsg.innerText = `❌ Error: ${error.message}`;
                    UI.errorMsg.classList.remove('hidden');
                    UI.processUI.classList.remove('active');
                } finally {
                    UI.btnGen.disabled = false;
                    UI.btnText.innerText = "Build Secure Config";
                    UI.progFill.style.width = '0%';
                }
            };

            const downloadConf = () => {
                const a = document.createElement('a');
                // Use plain text type to ensure broad compatibility without stripping newlines
                a.href = URL.createObjectURL(new Blob([currentSession.configStr], { type: 'text/plain' }));
                a.download = `${currentSession.fileName}.conf`;
                document.body.appendChild(a); 
                a.click(); 
                a.remove();
            };

            const copyGuide = async () => {
                try {
                    await navigator.clipboard.writeText(currentSession.guideStr);
                    const originalHTML = UI.btnCopy.innerHTML;
                    UI.btnCopy.innerHTML = "Copied! ✅";
                    UI.btnCopy.classList.replace('bg-white/10', 'bg-[#ccff00]');
                    UI.btnCopy.classList.replace('text-white', 'text-black');
                    setTimeout(() => {
                        UI.btnCopy.innerHTML = originalHTML;
                        UI.btnCopy.classList.replace('bg-[#ccff00]', 'bg-white/10');
                        UI.btnCopy.classList.replace('text-black', 'text-white');
                    }, 2000);
                } catch (e) {
                    alert("Please select the text and copy manually.");
                }
            };

            const resetApp = () => {
                UI.resSection.classList.add('hidden');
                UI.builderSection.classList.remove('hidden');
                UI.inName.value = '';
            };

            return {
                init: () => {
                    UI.btnGen.addEventListener('click', generateConfig);
                    UI.dlConf.addEventListener('click', downloadConf);
                    UI.btnCopy.addEventListener('click', copyGuide);
                    UI.btnReset.addEventListener('click', resetApp);
                    UI.inName.addEventListener('keypress', (e) => { if(e.key === 'Enter') generateConfig(); });
                }
            };
        })();

        document.addEventListener('DOMContentLoaded', App.init);
    </script>
</body>
</html>
