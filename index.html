                    const qrImg = new Image();
                    qrImg.onload = () => {
                        ctx.drawImage(qrImg, 0, 0);
                        ctx.fillStyle = '#000000';
                        ctx.font = 'bold 20px Montserrat, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(`Profile: ${config.name}`, size / 2, size + 25);
                        canvas.style.opacity = 1; // Show canvas
                    };
                    qrImg.src = qr.toDataURL();
                    
                    // Update Slider UI
                    UI.qrCounter.innerText = `${index + 1} / ${generatedConfigs.length}`;
                    UI.btnPrev.disabled = index === 0;
                    UI.btnNext.disabled = index === (generatedConfigs.length - 1);
                }, 150);
            };

            // Slider Controls Actions
            const handlePrev = (e) => {
                playTone('sine', 300, 50, 0.03);
                if (e) createRipple(e, UI.btnPrev);
                if (currentQrIndex > 0) {
                    currentQrIndex--;
                    renderQRCode(currentQrIndex);
                }
            };

            const handleNext = (e) => {
                playTone('sine', 300, 50, 0.03);
                if (e) createRipple(e, UI.btnNext);
                if (currentQrIndex < generatedConfigs.length - 1) {
                    currentQrIndex++;
                    renderQRCode(currentQrIndex);
                }
            };

            // Main Generation Process
            const generateConfigs = async (e) => {
                playTone('sine', 400, 50, 0.04);
                if(e) createRipple(e, UI.btnGen);

                let inputVal = UI.inName.value.trim();
                batchName = inputVal ? inputVal : "WP";
                
                UI.btnGen.disabled = true;
                UI.btnText.innerText = "Processing...";
                UI.errorMsg.classList.add('hidden');
                UI.processUI.classList.add('active');
                
                try {
                    await updateProgress(15, "Generating Keys...");
                    const keyPair = nacl.box.keyPair();
                    const privateKey = btoa(String.fromCharCode(...keyPair.secretKey));
                    const publicKey = btoa(String.fromCharCode(...keyPair.publicKey));
                    const genUUID = () => crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });

                    await updateProgress(40, "Registering Account...");
                    const cleanUrl = WORKER_URL.endsWith('/') ? WORKER_URL.slice(0, -1) : WORKER_URL;
                    const res = await fetch(`${cleanUrl}/api/generate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ key: publicKey, install_id: genUUID(), fcm_token: `${genUUID()}:APA91b${genUUID()}`, tos: new Date().toISOString() })
                    });
                    const data = await res.json();
                    if (!res.ok || !data.success) throw new Error(data.error || "API Response Failed");

                    await updateProgress(70, "Compiling Configs...");
                    
                    const zip = new JSZip();
                    generatedConfigs = [];
                    const enhancedDNS = "1.1.1.1, 8.8.8.8, 8.8.4.4";
                    
                    // Loop 20 times for dynamic IP/Port assignments
                    for (let i = 1; i <= 20; i++) {
                        const rIP = IPS[Math.floor(Math.random() * IPS.length)];
                        const rPort = PORTS[Math.floor(Math.random() * PORTS.length)];
                        const configName = `${batchName}-${i.toString().padStart(2, '0')}`;
                        
                        // IPv4 Standard WG Configuration
                        const configStr = `[Interface]
PrivateKey = ${privateKey}
Address = ${data.data.ipv4}/32
DNS = ${enhancedDNS}
MTU = 1280

[Peer]
PublicKey = ${data.data.server_public_key}
AllowedIPs = 0.0.0.0/0
Endpoint = ${rIP}:${rPort}
PersistentKeepalive = 25`;

                        generatedConfigs.push({ name: configName, data: configStr });
                        zip.file(`${configName}.conf`, configStr);
                    }

                    await updateProgress(90, "Packaging Data...");
                    generatedZipBlob = await zip.generateAsync({type: "blob"});
                    
                    // Render first QR Code
                    currentQrIndex = 0;
                    renderQRCode(currentQrIndex);
                    
                    await updateProgress(100, "Done!");
                    playTone('triangle', 440, null, 0.1); setTimeout(()=>playTone('triangle', 659.25, null, 0.3), 100);

                    UI.processUI.classList.remove('active');
                    UI.builderSection.classList.add('hidden');
                    
                    UI.guideBox.value = buildGuideText(batchName);
                    UI.resSection.classList.remove('hidden');

                } catch (error) {
                    UI.errorMsg.innerText = `❌ Error: ${error.message}`;
                    UI.errorMsg.classList.remove('hidden');
                    UI.processUI.classList.remove('active');
                } finally {
                    UI.btnGen.disabled = false;
                    UI.btnText.innerText = "Generate Secure Configs";
                    UI.progFill.style.width = '0%';
                }
            };

            // ZIP Download Action
            const downloadZip = (e) => {
                playTone('sine', 400, 50, 0.04);
                if(e) createRipple(e, UI.dlZip);
                if(!generatedZipBlob) return;

                const a = document.createElement('a');
                a.href = URL.createObjectURL(generatedZipBlob);
                a.download = `${batchName}_WireGuard_Pack.zip`;
                document.body.appendChild(a); 
                a.click(); 
                a.remove();
            };

            // Copy Guide Action
            const copyGuide = async (e) => {
                playTone('sine', 400, 50, 0.04);
                try {
                    await navigator.clipboard.writeText(UI.guideBox.value);
                    const originalHTML = UI.btnCopy.innerHTML;
                    UI.btnCopy.innerHTML = "Copied! ✅";
                    UI.btnCopy.classList.replace('bg-white/10', 'bg-[#ccff00]');
                    UI.btnCopy.classList.replace('text-white', 'text-black');
                    setTimeout(() => {
                        UI.btnCopy.innerHTML = originalHTML;
                        UI.btnCopy.classList.replace('bg-[#ccff00]', 'bg-white/10');
                        UI.btnCopy.classList.replace('text-black', 'text-white');
                    }, 2000);
                } catch (err) { alert("Please select the text and copy manually."); }
            };

            // Reset Form Action
            const resetApp = () => {
                playTone('sine', 400, 50, 0.04);
                UI.resSection.classList.add('hidden');
                UI.builderSection.classList.remove('hidden');
                UI.inName.value = '';
                generatedZipBlob = null;
                generatedConfigs = [];
            };

            return {
                init: () => {
                    UI.btnGen.addEventListener('click', generateConfigs);
                    UI.dlZip.addEventListener('click', downloadZip);
                    UI.btnCopy.addEventListener('click', copyGuide);
                    UI.btnReset.addEventListener('click', resetApp);
                    UI.btnPrev.addEventListener('click', handlePrev);
                    UI.btnNext.addEventListener('click', handleNext);
                    UI.inName.addEventListener('keypress', (e) => { if(e.key === 'Enter') generateConfigs(e); });
                }
            };
        })();

        document.addEventListener('DOMContentLoaded', App.init);
    </script>
</body>
</html>
