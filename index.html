<html lang="en">
<head>

    <style>
        :root { 
            --theme-prim: #ccff00; 
            --theme-prim-glow: rgba(204, 255, 0, 0.6);
            --theme-dan: #dc2626; 
            --theme-dan-glow: rgba(220, 38, 38, 0.6);
            --bg-base: #070709;
        }
        body { 
            background-color: var(--bg-base); 
            color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden; 
        }
        
        /* Ambient Background with Breathing Animation */
        .ambient-map { 
            position: fixed; inset: 0; z-index: -2; 
            background-color: var(--theme-prim); 
            -webkit-mask-image: url('https://upload.wikimedia.org/wikipedia/commons/e/ec/World_map_blank_without_borders.svg'); 
            mask-image: url('https://upload.wikimedia.org/wikipedia/commons/e/ec/World_map_blank_without_borders.svg'); 
            -webkit-mask-size: cover; mask-size: cover; opacity: 0.04; 
        }
        .ambient-lights { 
            position: fixed; inset: 0; z-index: -1; 
            background: radial-gradient(circle at 20% 30%, rgba(220, 38, 38, 0.15) 0%, transparent 50%), 
                        radial-gradient(circle at 80% 70%, rgba(204, 255, 0, 0.12) 0%, transparent 50%); 
            pointer-events: none; 
            animation: breath-light 6s ease-in-out infinite alternate;
        }
        @keyframes breath-light {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 1.2; transform: scale(1.1); }
        }

        /* 
         * ==========================================
         * BRANDING: Mr.Raptor SYNCHRONIZED BREATHING 
         * ==========================================
         */

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            animation: brand-breath 2.5s ease-in-out infinite alternate;
            cursor: default;
        }
        @keyframes brand-breath {
            0% {
                transform: scale(0.98);
                filter: drop-shadow(0 0 5px rgba(0,0,0,0));
            }
            100% {
                transform: scale(1.08);
                filter: drop-shadow(0 0 20px var(--theme-dan-glow)) 
                        drop-shadow(0 0 35px var(--theme-prim-glow));
            }
        }
        .mr-text { color: var(--theme-dan); }
        .raptor-text { color: var(--theme-prim); }

        /* 
         * ==========================================
         * UI LIGHTING & GLASSMORPHISM
         * ==========================================
         */
        .glass-box-wrapper {
            position: relative;
            border-radius: 24px;
            animation: float-box 6s ease-in-out infinite;
        }
        /* Animated Glowing Border for Glass Box */
        .glass-box-wrapper::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 26px;
            background: linear-gradient(45deg, transparent, var(--theme-prim), transparent, var(--theme-dan), transparent);
            background-size: 300% 300%;
            z-index: -1;
            animation: border-glow-move 4s linear infinite;
            opacity: 0.5;
        }
        @keyframes border-glow-move {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .glass-box { 
            background: linear-gradient(145deg, rgba(20, 20, 25, 0.8) 0%, rgba(10, 10, 12, 0.95) 100%); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 24px; 
            position: relative;
            z-index: 1;
        }
        @keyframes float-box {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        
        /* Inputs */
        .field-input, .field-select { 
            background: rgba(0, 0, 0, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: white; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .field-input:focus, .field-select:focus { 
            background: rgba(204, 255, 0, 0.08); 
            border-color: var(--theme-prim); 
            outline: none; 
            box-shadow: 0 0 20px rgba(204, 255, 0, 0.3); 
            transform: scale(1.02) translateY(-2px);
        }
        .field-select option { background: #1a1a1a; color: #fff; }

        /* Buttons & Ripple */
        .btn-main { 
            background: linear-gradient(135deg, #ccff00 0%, #99cc00 100%); 
            color: #000; 
            transition: all 0.3s ease; 
            position: relative; 
            overflow: hidden;
            z-index: 1;
        }
        .btn-main::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 100%);
            z-index: -1; opacity: 0; transition: opacity 0.3s;
        }
        .btn-main:hover::before { opacity: 1; }
        .btn-main:hover:not(:disabled) { 
            transform: translateY(-3px) scale(1.03); 
            box-shadow: 0 10px 30px rgba(204, 255, 0, 0.5); 
        }
        .btn-main:active:not(:disabled) {
            transform: translateY(1px) scale(0.98);
        }
        .btn-main:disabled { 
            opacity: 0.5; cursor: not-allowed; filter: grayscale(80%); transform: none;
        }
        
        /* Ripple Effect element created via JS */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0);
            animation: ripple-anim 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple-anim {
            to { transform: scale(4); opacity: 0; }
        }

        /* Process Animation UI */
        .process-container {
            overflow: hidden; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 0; opacity: 0;
        }
        .process-container.active { max-height: 200px; opacity: 1; margin-top: 1.5rem; }
        .progress-bar-bg {
            background: rgba(255,255,255,0.05); border-radius: 8px;
            height: 8px; width: 100%; overflow: hidden; margin-top: 12px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }
        .progress-bar-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #99cc00, #ccff00);
            box-shadow: 0 0 15px var(--theme-prim);
            transition: width 0.4s ease;
            position: relative;
        }
        .progress-bar-fill::after {
            content: ''; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            animation: shine 1.5s infinite;
        }
        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* LIVE ANIMATIONS FOR GW & PAYLOAD */
        .gw-badge {
            position: relative; background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(204, 255, 0, 0.4);
            box-shadow: inset 0 0 10px rgba(204, 255, 0, 0.1), 0 0 15px rgba(204, 255, 0, 0.2);
            transition: all 0.3s ease;
        }
        .gw-dot {
            display: inline-block; width: 10px; height: 10px;
            background-color: var(--theme-prim); border-radius: 50%;
            box-shadow: 0 0 10px var(--theme-prim);
            animation: radar-ping 1.2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        @keyframes radar-ping { 75%, 100% { transform: scale(3); opacity: 0; } }
        .gw-dot-core { position: absolute; width: 10px; height: 10px; background-color: var(--theme-prim); border-radius: 50%; }

        .spoof-badge {
            position: relative; background: rgba(16, 185, 129, 0.1);
            color: #34d399; overflow: hidden;
        }
        .spoof-badge::before {
            content: ''; position: absolute; inset: 0; border-radius: 0.75rem; padding: 2px;
            background: linear-gradient(90deg, #10b981, transparent, #10b981, transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; background-size: 200% auto;
            animation: border-flow 2s linear infinite;
        }
        @keyframes border-flow { to { background-position: 200% center; } }

        /* Scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(204,255,0,0.4); border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }

        .fade-in { animation: fadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    </style>
</head>

ဤ VPN Config သည် စက်တစ်လုံးတည်း (1 Device Only) အတွက်သာ သီးသန့်ထုတ်လုပ်ထားခြင်း ဖြစ်ပါသည်။ ဖုန်းတစ်လုံးထက်ပို၍ဖြစ်စေ၊ ကွန်ပျူတာနှင့် ပြိုင်တူဖြစ်စေ ခွဲသုံးပါက စနစ်မှ အလိုအလျောက် ပိတ်ပင် (Auto Block) မည်ဖြစ်ပြီး လိုင်းလုံးဝ ပြတ်တောက်သွားပါမည်။

⚙️ [၂] VPN အသုံးပြုနည်း အသေးစိတ်
၁။ ယခုစာမျက်နှာရှိ "DOWNLOAD CONFIG (.CONF)" ကိုနှိပ်၍ ဖိုင်ကို ဖုန်း/ကွန်ပျူတာထဲသို့ ဒေါင်းလုဒ် (Save) လုပ်ပါ။
၂။ ဒေါင်းလုဒ်ဆွဲထားသော AmneziaWG App ကို ဖွင့်ပါ။
၃။ App ၏ ညာဘက်အောက်ခြေ (သို့) အပေါ်ထောင့်ရှိ အပေါင်းလက္ခဏာ (+) ကို နှိပ်ပါ။
၄။ "Import from file or archive" ကိုရွေးချယ်ပြီး ခုနက ဒေါင်းလုဒ်ဆွဲထားသော .conf ဖိုင်ကို ရွေးချယ်ထည့်သွင်းပါ။
၅။ နာမည်ဘေးရှိ ခလုတ်လေးကို ဖွင့် (Turn On) လိုက်ပါက ချိတ်ဆက်မှု အောင်မြင်ပါပြီ။


🛡️ [၃] WARRANTY & SUPPORT (အာမခံချက်)
- အာမခံကာလအတွင်း ဖုန်းပျောက်သွားခြင်း၊ ဖုန်းပျက်သွားခြင်း၊ ဖုန်းအသစ်လဲလှယ်ခြင်းများ ကြုံတွေ့ရပါက Customer များအတွက် Config အသစ် အခမဲ့ ပြန်လည်ထုတ်ယူခွင့် ရှိပါသည်။
- စက်တစ်လုံးထက်ပိုသုံး၍ Block ခံရပါက အာမခံ ပျက်ပြယ်နိုင်ပါသည်။
- ချိတ်ဆက်မှု အဆင်မပြေခြင်း၊ လိုင်းကျခြင်း၊ ချိတ်မရတော့ခြင်း သို့မဟုတ် အခြားအခက်အခဲ တစ်စုံတစ်ရာ ရှိပါက Telegram တွင် Admin 👉 @MrRaptor 👈 သို့ အချိန်မရွေး ဆက်သွယ် အကူအညီ တောင်းခံနိုင်ပါသည်။

            const generateConfig = async (e) => {
                AudioSystem.init();
                AudioSystem.playClick();
                if(e) createRipple(e, UI.btnGen);

                let inputVal = UI.inName.value.trim();
                let profileName = inputVal;
                
                if (!inputVal) {
                    profileName = "RaptorWG_" + generateRandomString(5);
                }

                UI.btnGen.disabled = true;
                UI.btnText.innerText = "Processing...";
                UI.errorMsg.classList.add('hidden');
                UI.processUI.classList.add('active');
                
                try {
                    await updateProgress(15, "Generating Cryptographic Keys...");
                    const keyPair = nacl.box.keyPair();
                    const privateKey = btoa(String.fromCharCode(...keyPair.secretKey));
                    const publicKey = btoa(String.fromCharCode(...keyPair.publicKey));
                    const genUUID = () => crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });

                    await updateProgress(40, "Registering with Cloudflare WARP...");
                    const cleanUrl = WORKER_URL.endsWith('/') ? WORKER_URL.slice(0, -1) : WORKER_URL;
                    const res = await fetch(`${cleanUrl}/api/generate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            key: publicKey, 
                            install_id: genUUID(), 
                            fcm_token: `${genUUID()}:APA91b${genUUID()}`, 
                            tos: new Date().toISOString() 
                        })
                    });
                    const data = await res.json();
                    if (!res.ok || !data.success) throw new Error(data.error || "API Response Failed");

                    await updateProgress(70, "Applying Dynamic SIP Spoofing...");
                    const lvl = UI.inLevel.value;
                    let awgParams = "";
                    let mtu = 1280;

                    if (lvl === 'low') {
                        awgParams = `Jc = 3\nJmin = 1\nJmax = 3`;
                    } else if (lvl === 'medium') {
                        awgParams = `Jc = 4\nJmin = 10\nJmax = 20`;
                    } else {
                        awgParams = `Jc = 5\nJmin = 30\nJmax = 60`;
                        mtu = 1390;
                    }
                    
                    const payloads = generateDynamicPayloads();
                    const magicHeaders = generateMagicHeaders();

                    await updateProgress(90, "Finalizing Custom Profile...");
                    
                    const fileSafeName = profileName.replace(/[^a-zA-Z0-9_]/g, '_');
                    const selectedEndpoint = ENDPOINTS[Math.floor(Math.random() * ENDPOINTS.length)];
                    const enhancedDNS = "8.8.8.8, 8.8.4.4, 1.1.1.1, 2606:4700:4700::1111";

                    const finalConfig = `[Interface]
PrivateKey = ${privateKey}
Address = ${data.data.ipv4}/32, ${data.data.ipv6}/128
DNS = ${enhancedDNS}
MTU = ${mtu}
${awgParams}
${magicHeaders}
I1 = ${payloads.i1}
I2 = ${payloads.i2}

[Peer]
PublicKey = ${data.data.server_public_key}
AllowedIPs = 0.0.0.0/0, ::/0
Endpoint = ${selectedEndpoint}
PersistentKeepalive = 25`;

                    currentSession = { 
                        name: profileName, 
                        fileName: fileSafeName, 
                        endpoint: selectedEndpoint, 
                        configStr: finalConfig, 
                        guideStr: buildGuideText(profileName) 
                    };
                    
                    await updateProgress(100, "Configuration Ready!");
                    await sleep(400);

                    AudioSystem.playSuccess();
                    
                    UI.processUI.classList.remove('active');
                    UI.builderSection.classList.add('hidden');
                    
                    document.getElementById('res-name').innerText = currentSession.name;
                    document.getElementById('res-endpoint').innerText = `GW: ${currentSession.endpoint}`;
                    UI.guideBox.value = currentSession.guideStr;
                    UI.resSection.classList.remove('hidden');

                } catch (error) {
                    UI.errorMsg.innerText = `❌ Error: ${error.message}`;
                    UI.errorMsg.classList.remove('hidden');
                    UI.processUI.classList.remove('active');
                } finally {
                    UI.btnGen.disabled = false;
                    UI.btnText.innerText = "Build Secure Config";
                    UI.progFill.style.width = '0%';
                }
            };

            const downloadConf = (e) => {
                AudioSystem.init();
                AudioSystem.playClick();
                if(e) createRipple(e, UI.dlConf);

                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([currentSession.configStr], { type: 'application/octet-stream' }));
                a.download = `${currentSession.fileName}.conf`;
                document.body.appendChild(a); 
                a.click(); 
                a.remove();
            };

            const copyGuide = async (e) => {
                AudioSystem.init();
                AudioSystem.playClick();
                
                try {
                    await navigator.clipboard.writeText(currentSession.guideStr);
                    const originalHTML = UI.btnCopy.innerHTML;
                    UI.btnCopy.innerHTML = "Copied! ✅";
                    UI.btnCopy.classList.replace('bg-white/10', 'bg-[#ccff00]');
                    UI.btnCopy.classList.replace('text-white', 'text-black');
                    setTimeout(() => {
                        UI.btnCopy.innerHTML = originalHTML;
                        UI.btnCopy.classList.replace('bg-[#ccff00]', 'bg-white/10');
                        UI.btnCopy.classList.replace('text-black', 'text-white');
                    }, 2000);
                } catch (err) {
                    alert("Please select the text and copy manually.");
                }
            };

            const resetApp = () => {
                AudioSystem.init();
                AudioSystem.playClick();
                UI.resSection.classList.add('hidden');
                UI.builderSection.classList.remove('hidden');
                UI.inName.value = '';
            };

            return {
                init: () => {
                    UI.btnGen.addEventListener('click', generateConfig);
                    UI.dlConf.addEventListener('click', downloadConf);
                    UI.btnCopy.addEventListener('click', copyGuide);
                    UI.btnReset.addEventListener('click', resetApp);
                    UI.inName.addEventListener('keypress', (e) => { 
                        if(e.key === 'Enter') {
                            generateConfig(e); 
                        }
                    });
                }
            };
        })();

        document.addEventListener('DOMContentLoaded', App.init);
    </script>
